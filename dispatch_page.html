<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>战雷聊天 · 入口</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:24px 16px;background:#0d0d0d;color:#e8e8e8;
     font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
     display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:17px;font-weight:600;margin:8px 0 4px}
.sub{font-size:13px;color:#8a8a8a;margin-bottom:24px}
.card{width:100%;max-width:420px;background:#1a1a1a;border:1px solid #333;
      border-radius:14px;padding:20px;text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;
     background:#666;vertical-align:middle}
.dot.on{background:#7fd3a0}.dot.off{background:#ff8a6b}
#state{font-size:14px;color:#bbb;margin-bottom:14px}
a.btn{display:block;padding:18px;font-size:18px;font-weight:600;color:#0b0b0b;
      background:#7fd3a0;border-radius:10px;text-decoration:none;margin:6px 0}
a.btn.disabled{background:#3a3a3a;color:#777;pointer-events:none}
.meta{font-size:12px;color:#666;margin-top:12px;line-height:1.7;word-break:break-all}
.tip{font-size:12px;color:#8a8a8a;margin-top:18px;line-height:1.8;max-width:420px}
</style></head><body>
<h1>战争雷霆 · 手机发送</h1>
<div class="sub">此页只分发地址，实际通信在你的局域网内</div>
<div class="card">
  <div id="state"><span class="dot" id="dot"></span><span id="stateTxt">查询中……</span></div>
  <a class="btn disabled" id="go" href="#">进入发送页</a>
  <div class="meta" id="meta"></div>
</div>
<div class="tip">
  手机需与电脑连<strong>同一个 Wi-Fi</strong>。<br>
  本页每 8 秒自动刷新地址；电脑离线时按钮置灰。<br>
  若打不开，检查电脑是否开机、服务是否运行、是否同一网段。
</div>
<script>
const go=document.getElementById('go'), dot=document.getElementById('dot'),
      st=document.getElementById('stateTxt'), meta=document.getElementById('meta');
async function tick(){
  try{
    const r=await fetch('url.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const j=await r.json();
    const age=Math.round(Date.now()/1000-(j.ts||0));
    const online=age<90 && j.url;
    dot.className='dot '+(online?'on':'off');
    st.textContent=online?'电脑在线':'电脑离线';
    if(online){ go.href=j.url; go.className='btn'; go.textContent='进入发送页'; }
    else{ go.href='#'; go.className='btn disabled'; go.textContent='电脑离线'; }
    meta.innerHTML='地址：'+(j.url||'-')+'<br>更新于 '+
      (j.ts?new Date(j.ts*1000).toLocaleTimeString():'-')+'（'+age+' 秒前）';
  }catch(e){
    dot.className='dot off'; st.textContent='无法读取地址';
    go.className='btn disabled'; go.textContent='不可用';
    meta.textContent='url.json 读取失败';
  }
}
tick(); setInterval(tick,8000);
</script></body></html>
